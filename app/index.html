<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plateforme d'apprentissage pour la licence radioamateur avec répétition espacée">
  <title>Licence Radio Amateur - Apprentissage</title>

  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="assets/katex/katex.min.css">
  <script defer src="assets/katex/katex.min.js"></script>
  <script defer src="assets/katex/contrib/auto-render.min.js"></script>

  <!-- Application styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header" id="app-header">
      <div class="header-left">
        <button class="header-btn header-back" id="header-back" style="display: none;">
          <span class="icon">←</span>
        </button>
        <h1 class="header-title" id="header-title">Licence Radio</h1>
      </div>
      <div class="header-center" id="header-center"></div>
      <div class="header-right" id="header-right">
        <button class="header-btn" id="btn-formulas" title="Formules">
          <span class="icon">∑</span>
        </button>
        <button class="header-btn" id="btn-settings" title="Paramètres">
          <span class="icon">⚙</span>
        </button>
      </div>
    </header>

    <main id="main-content">
      <!-- Content rendered by JavaScript -->
      <div class="loading">Chargement...</div>
    </main>

    <footer class="app-footer">
      <p>Contenu original: F6GPX - Jean-Luc Fortin | CC BY-NC-SA 4.0</p>
    </footer>
  </div>

  <!-- Application modules -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
